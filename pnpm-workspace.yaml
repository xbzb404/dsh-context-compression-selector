packages:
  - packages/*

linkWorkspacePackages: true

peerDependencyRules:
  allowedVersions:
    # @deepseek-ai/dsh-invariants is still published only up to 0.2.0-rc.2, whose
    # peer range is `@deepseek-ai/cordis: ~4.0.4`. Harness 0.2.2 ships cordis
    # 4.1.0, so that range is stale. The surface this plugin uses (Service,
    # Inject, merged Context) is unchanged across 4.0 → 4.1.
    "@deepseek-ai/cordis": ">=4.0.4 <5"
    typescript: ">=5 <7"

overrides:
  # Pinning cordis to the single version the Harness actually ships is not
  # cosmetic: `@deepseek-ai/cordis` carries an ambient `declare module` that
  # merges the `Context` interface, and `@deepseek-ai/dsh-invariants` augments
  # that same interface with `ctx.invariants`. Two cordis instances means two
  # unrelated `Context` types, so the invariant installer no longer satisfies
  # `InvariantInstaller` and `ctx.invariants` "does not exist". Forcing one
  # instance is also what production does: the Host resolves a single cordis.
  #
  # `1.1.0` has no peer dependencies of its own, while `1.0.6` peers on cordis —
  # so pinning the loader is what actually collapses the cordis peer variations
  # from two instances down to one.
  "@deepseek-ai/cordis": 4.1.0
  "@deepseek-ai/cordis-plugin-loader": 1.1.0
  "@deepseek-ai/cordis-plugin-include": 1.1.0
  "@deepseek-ai/cordis-plugin-group": 1.1.0
  "@deepseek-ai/schemastery": 3.19.0
  # @testing-library/react accepts `react-dom: ^18 || ^19`, and a fresh
  # resolution picks 19 — which cannot pair with the React 18 the client half
  # is built against (`react: >=18 <19`). Pin the renderer to React 18 so a
  # clean install cannot silently pull a second, incompatible React runtime.
  react-dom: 18.3.1

allowBuilds:
  esbuild: true
  koffi: true
  "@huggingface/tokenizers": true

